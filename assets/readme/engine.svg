<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="e-title e-desc">
  <title id="e-title">Seamless crossfade loop engine</title>
  <desc id="e-desc">Each sound file is split into head, middle and tail. The head fades in, the tail fades out, and the two are summed into one equal-power crossfade region, so the loop point is inaudible.</desc>
  <rect width="1200" height="470" rx="28" fill="#0b0b0d"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="66" fill="#f2f2f4" font-size="30" font-weight="700">The loop point is designed out</text>
    <text x="64" y="100" fill="#8f8f96" font-size="20">head fades in · tail fades out · summed into one equal-power crossfade</text>
    <rect x="64" y="166" width="170" height="88" rx="10" fill="#1c1c20" stroke="#26262b" stroke-width="1.5"/><text x="149" y="202" text-anchor="middle" fill="#f2f2f4" font-size="21" font-weight="600">head</text><text x="149" y="230" text-anchor="middle" fill="#8f8f96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">fade in</text><rect x="250" y="166" width="520" height="88" rx="10" fill="#161619" stroke="#26262b" stroke-width="1.5"/><text x="510" y="202" text-anchor="middle" fill="#f2f2f4" font-size="21" font-weight="600">middle</text><text x="510" y="230" text-anchor="middle" fill="#8f8f96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">unchanged</text><rect x="786" y="166" width="170" height="88" rx="10" fill="#1c1c20" stroke="#26262b" stroke-width="1.5"/><text x="871" y="202" text-anchor="middle" fill="#f2f2f4" font-size="21" font-weight="600">tail</text><text x="871" y="230" text-anchor="middle" fill="#8f8f96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">fade out</text><text x="64" y="150" fill="#8f8f96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">SOURCE</text><text x="64" y="318" fill="#8f8f96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">LOOP UNIT</text><rect x="250" y="334" width="380" height="88" rx="10" fill="#161619" stroke="#26262b" stroke-width="1.5"/><text x="440" y="370" text-anchor="middle" fill="#f2f2f4" font-size="21" font-weight="600">middle</text><rect x="646" y="334" width="310" height="88" rx="10" fill="#232328" stroke="#26262b" stroke-width="1.5"/><text x="801" y="370" text-anchor="middle" fill="#f2f2f4" font-size="21" font-weight="600">tail ⊕ head</text><text x="801" y="398" text-anchor="middle" fill="#8f8f96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">equal-power</text>
    <path d="M 149 258 C 149 300, 380 300, 420 328" fill="none" stroke="#8f8f96" stroke-width="2"/>
    <path d="M 871 258 C 871 300, 700 300, 660 328" fill="none" stroke="#8f8f96" stroke-width="2"/>
    <path d="M 956 378 L 1046 378 Q 1080 378 1080 344 L 1080 220 Q 1080 210 1046 210 L 1004 210" fill="none" stroke="#f2f2f4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 1012 202 L 1000 210 L 1012 218" fill="none" stroke="#f2f2f4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1096" y="286" fill="#f2f2f4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">loop</text>
  </g>
</svg>