<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="h-title h-desc">
  <title id="h-title">Open Noise</title>
  <desc id="h-desc">Open Noise is an open source ambient soundscape player with seamless crossfade looping, built with Web Audio and Tauri for macOS, Windows, Linux, and Android.</desc>
  <rect width="1200" height="380" rx="28" fill="#0b0b0d"/>
  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="92" fill="#8f8f96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" letter-spacing="3.5">OPEN SOURCE  ·  AMBIENT SOUNDSCAPE</text>
    <text x="0" y="196" fill="#f2f2f4" font-size="86" font-weight="700" letter-spacing="-1.5">Open Noise</text>
    <text x="0" y="252" fill="#f2f2f4" fill-opacity="0.86" font-size="27">Seamless crossfade looping for endless,</text>
    <text x="0" y="292" fill="#f2f2f4" fill-opacity="0.86" font-size="27">gapless ambient sound.</text>
    <text x="0" y="344" fill="#8f8f96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">Web Audio  ·  Tauri  ·  macOS / Windows / Linux / Android</text>
  </g>
